
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">

  <div class="card shadow p-4" style="width: 400px;">

  
    <div class="text-center mb-4">
      <h2 class="fw-bold">Login</h2>
      <p class="text-muted">Sign in to your account</p>
    </div>

   
    <form [formGroup]="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">
          Username
        </label>

        <input 
          formControlName ="username"
          type="text"
          id="username"
          class="form-control"
          placeholder="Enter your Username"
        />
        <small style="margin-bottom: 25px;" class="text-danger" *ngIf="loginForm.controls['username'].dirty && loginForm.controls['username'].hasError('required')" >Username is Required</small>
      </div>
      
      
      <div class="mb-3">
        <label for="password" class="form-label">
          Password
        </label>

        <input
          formControlName ="password"
          type="password"
          id="password"
          class="form-control"
          placeholder="Enter your password"
        />
        <small style="margin-bottom: 25px;" class="text-danger" *ngIf="loginForm.controls['password'].dirty && loginForm.controls['password'].hasError('required')" >Password is Required</small>
      </div>

      
      <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="rememberMe"
          />

          <label class="form-check-label" for="rememberMe">
            Remember me
          </label>
        </div>

        <a href="#" class="text-decoration-none">
          Forgot Password?
        </a>

      </div>

    
      <div class="d-grid">
        <button
          type="submit"
          class="btn btn-primary btn-lg">
          Login
        </button>
      </div>

  
      <div class="text-center mt-4">
        <span class="text-muted">Don't have an account?</span>

        <a href="#" class="text-decoration-none ms-1">
          Register
        </a>
      </div>

    </form>

  </div>

</div>
